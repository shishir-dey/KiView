[package]
name = "kiview-wasm"
version = "0.1.0"
edition = "2021"
description = "KiCad PCB to Three.js BufferGeometry parser for KiView"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
earcutr = "0.4"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
